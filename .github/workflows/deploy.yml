name: Deploy Linuxo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir deploy
          rsync -av . deploy/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='test/' \
            --exclude='deploy/'

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          local_path: './deploy/*'
          remote_path: ${{ vars.SFTP_REMOTE_PATH || './' }}
          sftp_only: true

      - name: Restart Linuxo server
        env:
          PTERODACTYL_URL: https://console.vexanode.gg
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          SERVER_ID: 10514f17
        run: |
          curl -X POST \
            "$PTERODACTYL_URL/api/client/servers/$SERVER_ID/power" \
            -H "Authorization: Bearer $PTERODACTYL_API_KEY" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -H "Content-Type: application/json" \
            -d '{"signal":"restart"}'
