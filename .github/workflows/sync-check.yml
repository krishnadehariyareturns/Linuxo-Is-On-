name: SFTP Sync Check

on:
  workflow_dispatch:

jobs:
  sync-check:
    name: Check SFTP vs GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SFTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Create GitHub file list
        shell: bash
        run: |
          set -euo pipefail

          git ls-files \
            ':!docs/**' \
            ':!.github/**' \
            ':!node_modules/**' \
            ':!.env' \
            ':!*.log' \
            | sort -u > github-files.txt

      - name: Download SFTP file list
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?SFTP_HOST secret is required}"
          : "${SFTP_USERNAME:?SFTP_USERNAME secret is required}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD secret is required}"
          : "${SFTP_PORT:?SFTP_PORT secret is required}"
          : "${SFTP_PATH:?SFTP_PATH secret is required}"

          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" \
            -p "$SFTP_PORT" \
            "sftp://$SFTP_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          cls -1 -a -R "$SFTP_PATH" > sftp-files.txt
          bye
          EOF

          # Convert the absolute remote path into a repository-relative path.
          sed "s#^${SFTP_PATH%/}/##" sftp-files.txt \
            | sed 's#/$##' \
            | sed '/^$/d' \
            | sort -u > sftp-files.txt

      - name: Compare files
        shell: bash
        run: |
          set -euo pipefail

          comm -23 sftp-files.txt github-files.txt > sftp-only.txt
          comm -13 sftp-files.txt github-files.txt > github-only.txt

      - name: Show sync report
        shell: bash
        run: |
          {
            echo "## 🔍 SFTP Sync Check"
            echo ""

            echo "### ⚠️ Files on SFTP but NOT in GitHub"
            echo ""

            if [ -s sftp-only.txt ]; then
              echo '```text'
              cat sftp-only.txt
              echo '```'
            else
              echo "None."
            fi

            echo ""
            echo "### ℹ️ Files in GitHub but NOT on SFTP"
            echo ""

            if [ -s github-only.txt ]; then
              echo '```text'
              cat github-only.txt
              echo '```'
            else
              echo "None."
            fi

            echo ""
            echo "### 📊 Summary"
            echo ""
            echo "- SFTP-only files: $(wc -l < sftp-only.txt)"
            echo "- GitHub-only files: $(wc -l < github-only.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
